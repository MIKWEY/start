<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MIKE – I'll make your body rock."
    />
    <meta name="theme-color" content="#111827" />
    <title>MIKE — I'll make your body rock</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #111827;
        --ink: #f8fafc;
        --muted: #aeb8cc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: var(--page);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .ambilight {
        position: fixed;
        z-index: -2;
        inset: -14vmax;
        overflow: hidden;
        pointer-events: none;
        background: #070914;
      }

      .ambilight video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 0.6;
        filter: blur(4.5rem) saturate(1.65) brightness(0.65);
        transform: scale(1.12);
      }

      .ambilight::after {
        position: absolute;
        inset: 0;
        content: "";
        background:
          radial-gradient(ellipse at center, transparent 5%, rgba(8, 10, 21, 0.28) 52%, rgba(5, 7, 16, 0.94) 100%),
          rgba(7, 9, 20, 0.2);
      }

      main {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: clamp(1.75rem, 4vh, 3.5rem);
        min-height: 100vh;
        width: min(92vw, 1100px);
        margin: 0 auto;
        padding: clamp(2rem, 6vh, 5rem) 0;
      }

      .eyebrow {
        margin: 0 0 0.65rem;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-align: center;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 100%;
        font-size: clamp(2.15rem, 5.5vw, 4.75rem);
        font-weight: 900;
        letter-spacing: -0.06em;
        line-height: 0.92;
        text-align: center;
        color: transparent;
        background: linear-gradient(
          105deg,
          #ff4b91 0%,
          #ffca5f 18%,
          #69f0ae 36%,
          #5ac8fa 54%,
          #8f7cff 72%,
          #ff63b8 90%,
          #ffca5f 100%
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 0 18px rgba(122, 192, 255, 0.18));
        animation: shimmer 4s linear infinite;
        user-select: none;
      }

      h1 span {
        display: block;
      }

      h1 span:last-child {
        margin-top: 0.1em;
        font-size: 0.72em;
        letter-spacing: -0.045em;
      }

      .video-frame {
        position: relative;
        width: min(100%, 820px);
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 1rem;
        background: #080b12;
        box-shadow:
          0 1.25rem 4rem rgba(0, 0, 0, 0.55),
          0 0 5rem rgba(138, 119, 255, 0.15);
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: brightness(1.03) contrast(1.06) saturate(1.08);
      }

      video:focus-visible {
        outline: 3px solid #69f0ae;
        outline-offset: -3px;
      }

      .hint {
        margin: -0.75rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
        text-align: center;
      }

      .tape-player {
        width: min(100%, 660px);
        color: #17152a;
      }

      .tape-player > .eyebrow {
        margin-bottom: 0.7rem;
      }

      .cassette {
        position: relative;
        min-height: 338px;
        overflow: hidden;
        padding: clamp(1.5rem, 4vw, 2.15rem);
        border: 0.35rem solid #383431;
        border-radius: 0.42rem 0.42rem 1.35rem 1.35rem;
        background:
          linear-gradient(115deg, rgba(255, 255, 255, 0.22), transparent 25%),
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.06) 0 1px, transparent 1px 3px),
          #d4c5a3;
        box-shadow: 0 1.5rem 3.5rem rgba(0, 0, 0, 0.5), 0 0 3rem rgba(255, 198, 90, 0.18);
      }

      .cassette::before,
      .cassette::after {
        position: absolute;
        bottom: 0;
        width: 37%;
        height: 3.35rem;
        content: "";
        background: #383431;
        clip-path: polygon(0 100%, 15% 0, 100% 0, 100% 100%);
      }

      .cassette::before { left: 0; }
      .cassette::after { right: 0; transform: scaleX(-1); }

      .cassette-screw {
        position: absolute;
        z-index: 3;
        width: 0.62rem;
        height: 0.62rem;
        border: 1px solid #625a4d;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #f7ecd1 0 13%, #847966 16% 44%, #3c3934 47% 52%, #b4a68d 55%);
      }

      .cassette-screw::after { position: absolute; inset: 45% 13%; height: 1px; content: ""; background: #393631; transform: rotate(-35deg); }
      .screw-tl { top: 0.75rem; left: 0.75rem; }
      .screw-tr { top: 0.75rem; right: 0.75rem; }
      .screw-bl { bottom: 1rem; left: 1.15rem; }
      .screw-br { right: 1.15rem; bottom: 1rem; }

      .cassette-label {
        position: relative;
        z-index: 1;
        min-height: 12.3rem;
        padding: 1rem 1.2rem 0.85rem;
        border: 0.16rem solid #4c463e;
        border-radius: 0.15rem;
        background: #e9d659;
        box-shadow: inset 0 0 0 0.32rem rgba(255, 246, 185, 0.46);
        clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%);
      }

      .cassette-brand {
        margin: 0;
        color: #51462c;
        font-size: 0.7rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-align: center;
      }

      .track-name {
        min-height: 2.35em;
        margin: 0.45rem 0 0.7rem;
        font-family: "Arial Narrow", Arial, sans-serif;
        font-size: clamp(1.15rem, 3.8vw, 1.65rem);
        font-weight: 900;
        line-height: 1.05;
        text-align: center;
        text-transform: uppercase;
      }

      .reels {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .reel {
        width: 4.35rem;
        aspect-ratio: 1;
        border: 0.38rem solid #393631;
        border-radius: 50%;
        background: repeating-conic-gradient(#ddd4bd 0 20deg, #504a42 20deg 32deg, #ddd4bd 32deg 52deg);
        box-shadow: 0 0 0 0.2rem #817763, inset 0 0 0 0.86rem #d8c6a7;
      }

      .cassette.is-playing .reel { animation: spin 1.4s linear infinite reverse; }

      .tape-window {
        flex: 1;
        height: 1.35rem;
        border: 0.27rem solid #393631;
        border-radius: 0.16rem;
        background: repeating-linear-gradient(90deg, #553526 0 0.25rem, #ae7654 0.25rem 0.47rem);
        box-shadow: inset 0 0 0 0.18rem #9b8c73;
      }

      .player-controls {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: auto auto 1fr auto auto;
        align-items: center;
        gap: 0.6rem;
        margin-top: 1rem;
      }

      .player-button {
        display: grid;
        width: 2.5rem;
        height: 2.5rem;
        place-items: center;
        padding: 0;
        border: 2px solid #17152a;
        border-radius: 50%;
        color: #fff7d8;
        background: #25213d;
        cursor: pointer;
      }

      .player-button:hover { background: #ff4b91; }
      .player-button:focus-visible, .track-picker:focus-visible, .progress:focus-visible { outline: 3px solid #17152a; outline-offset: 3px; }
      .player-button svg { width: 1rem; height: 1rem; fill: currentColor; }

      .progress { width: 100%; accent-color: #25213d; cursor: pointer; }
      .time { min-width: 4.5rem; font-variant-numeric: tabular-nums; font-size: 0.76rem; font-weight: 700; text-align: right; }

      .track-picker {
        position: relative;
        z-index: 2;
        width: 100%;
        margin-top: 0.9rem;
        padding: 0.65rem 0.8rem;
        border: 2px solid #17152a;
        border-radius: 0.35rem;
        color: #17152a;
        background: #fff7d8;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 700;
      }

      @keyframes shimmer {
        to {
          background-position: 250% center;
        }
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        h1 {
          animation: none;
          background-position: 50% center;
        }
      }

      @media (max-width: 480px) {
        main {
          width: min(92vw, 820px);
        }

        .video-frame {
          border-radius: 0.75rem;
        }

        h1 span:last-child {
          font-size: 0.68em;
        }

        .cassette { min-height: 300px; }
        .player-controls { gap: 0.4rem; }
      }
    </style>
  </head>
  <body>
    <div class="ambilight" aria-hidden="true">
      <video autoplay loop muted playsinline preload="auto">
        <source src="mike-body-rock.mp4" type="video/mp4" />
      </video>
    </div>
    <main>
      <header>
        <p class="eyebrow">Music video</p>
        <h1>
          <span>Mike Weyman</span>
          <span>I´ll Make Your Body Rock</span>
        </h1>
      </header>
      <div class="video-frame">
        <video
          autoplay
          loop
          muted
          playsinline
          controls
          preload="metadata"
          aria-label="Musikvideo: Mike – I'll make your body rock"
        >
          <source src="mike-body-rock.mp4" type="video/mp4" />
          Dein Browser unterstützt dieses Videoformat nicht.
        </video>
      </div>
      <p class="hint">Ton über die Videosteuerung aktivieren.</p>
      <section class="tape-player" aria-label="Musikplayer">
        <p class="eyebrow">MIKE · Die Musikkassette</p>
        <div class="cassette">
          <span class="cassette-screw screw-tl" aria-hidden="true"></span>
          <span class="cassette-screw screw-tr" aria-hidden="true"></span>
          <span class="cassette-screw screw-bl" aria-hidden="true"></span>
          <span class="cassette-screw screw-br" aria-hidden="true"></span>
          <div class="cassette-label">
            <p class="cassette-brand">Mike Weyman</p>
            <p class="track-name" id="track-name">24 / 7</p>
            <div class="reels" aria-hidden="true"><span class="reel"></span><span class="tape-window"></span><span class="reel"></span></div>
          </div>
          <div class="player-controls">
            <button class="player-button" id="previous" type="button" aria-label="Vorheriger Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zm12 0L9 12l9 7z"/></svg></button>
            <button class="player-button" id="play" type="button" aria-label="Abspielen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
            <input class="progress" id="progress" type="range" min="0" max="100" value="0" aria-label="Wiedergabefortschritt" />
            <span class="time" id="time">0:00 / 0:00</span>
            <button class="player-button" id="next" type="button" aria-label="Nächster Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM6 5l9 7-9 7z"/></svg></button>
          </div>
          <select class="track-picker" id="track-picker" aria-label="Titel auswählen"></select>
        </div>
        <audio id="audio" preload="metadata"></audio>
      </section>
    </main>
    <script>
      const ambientVideo = document.querySelector('.ambilight video');
      const mainVideo = document.querySelector('.video-frame video');

      const syncAmbient = () => {
        if (Math.abs(ambientVideo.currentTime - mainVideo.currentTime) > 0.25) {
          ambientVideo.currentTime = mainVideo.currentTime;
        }
      };

      mainVideo.addEventListener('play', () => {
        syncAmbient();
        ambientVideo.play().catch(() => {});
      });
      mainVideo.addEventListener('seeking', syncAmbient);
      mainVideo.addEventListener('pause', () => ambientVideo.pause());

      const tracks = [
        ['24 / 7', 'twentyfour_seven.mp3'], ['Elaine', 'elaine.mp3'], ['Give Me the Chocolate', 'give_me_the_chocolate.mp3'],
        ['Into Your Sky', 'into_your_sky.mp3'], ['Priceless', 'priceless.mp3'], ['SummerSurf (Club Mix)', 'summersurf_club_mix.mp3'],
        ["Don't Think Twice", 'dont_think_twice.mp3'], ['Spinning with Sven', 'spinning_with_sven.mp3'], ['Perfect Day', 'perfect_day.mp3'],
        ['SummerSurf', 'summersurf.mp3'], ['Get It On', 'get_it_on.mp3'], ['We Remain as Two', 'we_remain_as_two.mp3'],
        ['Angelique 2011', 'angelique_2011.mp3'], ['Girl for Life', 'girl_for_life.mp3'], ['He Smiles 2011', 'he_smiles_2011.mp3'],
        ['Christmas', 'christmas.mp3'], ['Open Up Your Life', 'open_up_your_life.mp3'], ['He Smiles Remix', 'he_smiles_remix.mp3'],
        ["I'll Make Your Body Rock", 'Ill_make_your_body_rock.mp3'], ['This Is Your Day', 'this_is_your_day.mp3'], ['Everybody', 'everybody.mp3']
      ];
      const audio = document.querySelector('#audio');
      const cassette = document.querySelector('.cassette');
      const playButton = document.querySelector('#play');
      const progress = document.querySelector('#progress');
      const time = document.querySelector('#time');
      const picker = document.querySelector('#track-picker');
      const trackName = document.querySelector('#track-name');
      let currentTrack = 0;

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds)) return '0:00';
        return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
      };
      const setPlayIcon = (playing) => {
        playButton.setAttribute('aria-label', playing ? 'Pausieren' : 'Abspielen');
        playButton.innerHTML = playing
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
      };
      const loadTrack = (index, autoplay = false) => {
        currentTrack = (index + tracks.length) % tracks.length;
        const [title, file] = tracks[currentTrack];
        audio.src = file;
        trackName.textContent = title;
        picker.value = currentTrack;
        progress.value = 0;
        time.textContent = '0:00 / 0:00';
        if (autoplay) audio.play().catch(() => {});
      };

      tracks.forEach(([title], index) => picker.add(new Option(`${String(index + 1).padStart(2, '0')} · ${title}`, index)));
      loadTrack(0);
      playButton.addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
      document.querySelector('#previous').addEventListener('click', () => loadTrack(currentTrack - 1, true));
      document.querySelector('#next').addEventListener('click', () => loadTrack(currentTrack + 1, true));
      picker.addEventListener('change', () => loadTrack(Number(picker.value), !audio.paused));
      progress.addEventListener('input', () => { if (audio.duration) audio.currentTime = audio.duration * (progress.value / 100); });
      audio.addEventListener('timeupdate', () => {
        progress.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
        time.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      });
      audio.addEventListener('play', () => { cassette.classList.add('is-playing'); setPlayIcon(true); mainVideo.pause(); });
      audio.addEventListener('pause', () => { cassette.classList.remove('is-playing'); setPlayIcon(false); });
      audio.addEventListener('ended', () => loadTrack(currentTrack + 1, true));
    </script>
  </body>
</html>
