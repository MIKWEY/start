<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MIKE – I'll make your body rock."
    />
    <meta name="theme-color" content="#111827" />
    <title>MIKE — I'll make your body rock</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #111827;
        --ink: #f8fafc;
        --muted: #aeb8cc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: var(--page);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .ambilight {
        position: fixed;
        z-index: -2;
        inset: -14vmax;
        overflow: hidden;
        pointer-events: none;
        background: #070914;
      }

      .ambilight video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 0.6;
        filter: blur(4.5rem) saturate(1.65) brightness(0.65);
        transform: scale(1.12);
      }

      .ambilight::after {
        position: absolute;
        inset: 0;
        content: "";
        background:
          radial-gradient(ellipse at center, transparent 5%, rgba(8, 10, 21, 0.28) 52%, rgba(5, 7, 16, 0.94) 100%),
          rgba(7, 9, 20, 0.2);
      }

      main {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: clamp(1.75rem, 4vh, 3.5rem);
        min-height: 100vh;
        width: min(92vw, 1100px);
        margin: 0 auto;
        padding: clamp(2rem, 6vh, 5rem) 0;
      }

      .eyebrow {
        margin: 0 0 0.65rem;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-align: center;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 100%;
        font-size: clamp(2.15rem, 5.5vw, 4.75rem);
        font-weight: 900;
        letter-spacing: -0.06em;
        line-height: 0.92;
        text-align: center;
        color: transparent;
        background: linear-gradient(
          105deg,
          #ff4b91 0%,
          #ffca5f 18%,
          #69f0ae 36%,
          #5ac8fa 54%,
          #8f7cff 72%,
          #ff63b8 90%,
          #ffca5f 100%
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 0 18px rgba(122, 192, 255, 0.18));
        animation: shimmer 4s linear infinite;
        user-select: none;
      }

      h1 span {
        display: block;
      }

      h1 span:last-child {
        margin-top: 0.1em;
        font-size: 0.72em;
        letter-spacing: -0.045em;
      }

      .video-frame {
        position: relative;
        width: min(100%, 820px);
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 1rem;
        background: #080b12;
        box-shadow:
          0 1.25rem 4rem rgba(0, 0, 0, 0.55),
          0 0 5rem rgba(138, 119, 255, 0.15);
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: brightness(1.03) contrast(1.06) saturate(1.08);
      }

      video:focus-visible {
        outline: 3px solid #69f0ae;
        outline-offset: -3px;
      }

      .hint {
        margin: -0.75rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
        text-align: center;
      }

      @keyframes shimmer {
        to {
          background-position: 250% center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        h1 {
          animation: none;
          background-position: 50% center;
        }
      }

      @media (max-width: 480px) {
        main {
          width: min(92vw, 820px);
        }

        .video-frame {
          border-radius: 0.75rem;
        }

        h1 span:last-child {
          font-size: 0.68em;
        }

      }
    </style>
  </head>
  <body>
    <div class="ambilight" aria-hidden="true">
      <video autoplay loop muted playsinline preload="auto">
        <source src="mike-body-rock.mp4" type="video/mp4" />
      </video>
    </div>
    <main>
      <header>
        <p class="eyebrow">Music video</p>
        <h1>
          <span>Mike Weyman</span>
          <span>I´ll Make Your Body Rock</span>
        </h1>
      </header>
      <div class="video-frame">
        <video
          autoplay
          loop
          muted
          playsinline
          controls
          preload="metadata"
          aria-label="Musikvideo: Mike – I'll make your body rock"
        >
          <source src="mike-body-rock.mp4" type="video/mp4" />
          Dein Browser unterstützt dieses Videoformat nicht.
        </video>
      </div>
      <p class="hint">Ton über die Videosteuerung aktivieren.</p>
    </main>
    <script>
      const ambientVideo = document.querySelector('.ambilight video');
      const mainVideo = document.querySelector('.video-frame video');

      const syncAmbient = () => {
        if (Math.abs(ambientVideo.currentTime - mainVideo.currentTime) > 0.25) {
          ambientVideo.currentTime = mainVideo.currentTime;
        }
      };

      mainVideo.addEventListener('play', () => {
        syncAmbient();
        ambientVideo.play().catch(() => {});
      });
      mainVideo.addEventListener('seeking', syncAmbient);
      mainVideo.addEventListener('pause', () => ambientVideo.pause());

    </script>
  </body>
</html>
